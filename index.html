<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Animaux de la Ferme</title>
    
    <style>
        :root {
            --vert: #7fbc48;
            --bleu: #53a4db;
            --noir: #494949;
            --gris: #b7b7b7;
            --fond: #ffffff;
            --rouge: #e62d32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fond);
            color: var(--noir);
            overflow: hidden;
        }

        /* ===== PAGE D'ACCUEIL ===== */
        #page-accueil {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            background: linear-gradient(135deg, var(--vert) 0%, var(--bleu) 100%);
        }

        #page-accueil.cachee {
            display: none;
        }

        .titre-accueil {
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: var(--fond);
            margin-bottom: 2rem;
            text-align: center;
            font-weight: bold;
        }

        .carrousel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .carrousel {
            display: flex;
            gap: 1.5rem;
            overflow: hidden;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
        }

        .carrousel::-webkit-scrollbar {
            height: 8px;
        }

        .carrousel::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .carrousel::-webkit-scrollbar-thumb {
            background: var(--fond);
            border-radius: 10px;
        }

        .carte-paysage {
            flex: 0 0 100%;
            scroll-snap-align: center;
            background: var(--fond);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            min-height: 300px;
        }

        .carte-paysage:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .carte-thumbnail {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: var(--gris);
        }

        .carte-nom {
            padding: 1.5rem;
            text-align: center;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: bold;
            color: var(--vert);
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bouton-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--fond);
            border: none;
            width: clamp(40px, 8vw, 50px);
            height: clamp(40px, 8vw, 50px);
            border-radius: 50%;
            cursor: pointer;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--vert);
            z-index: 10;
            transition: background-color 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .bouton-nav:hover {
            background-color: var(--vert);
            color: var(--fond);
        }

        .bouton-nav.prev {
            left: -60px;
        }

        .bouton-nav.next {
            right: -60px;
        }

        /* ===== PAGE PAYSAGE ===== */
        #page-paysage {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: var(--fond);
        }

        #page-paysage.cachee {
            display: none;
        }

        /* En-tête compact */
        .entete {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.5rem;
            background-color: var(--bleu);
            color: var(--fond);
            min-height: auto;
            flex-shrink: 0;
        }

        .entete-titre {
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: bold;
            flex-grow: 1;
            text-align: center;
        }

        .bouton-retour {
            background: transparent;
            border: 2px solid var(--fond);
            color: var(--fond);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: clamp(0.8rem, 2vw, 1rem);
            font-weight: bold;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .bouton-retour:hover {
            background: var(--fond);
            color: var(--bleu);
        }

        /* Zone paysage */
        .zone-paysage {
            flex-grow: 1;
            position: relative;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--fond);
        }

        .conteneur-paysage {
            position: relative;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            touch-action: pinch-zoom;
        }

        /* Animaux */
        .animal {
            position: absolute;
            cursor: pointer;
            transition: filter 0.2s ease;
            image-rendering: crisp-edges;
        }

        .animal:hover {
            filter: brightness(1.15);
        }

        .animal:active {
            filter: brightness(0.85);
        }

        /* Indicateur son en lecture */
        .animal.jouant {
            animation: pulse-animal 0.5s ease-in-out;
        }

        @keyframes pulse-animal {
            0%, 100% {
                filter: drop-shadow(0 0 0px rgba(127, 188, 72, 0.8));
            }
            50% {
                filter: drop-shadow(0 0 8px rgba(127, 188, 72, 0.8));
            }
        }

        /* Responsive tablette/petit écran */
        @media (max-width: 768px) {
            .bouton-nav.prev,
            .bouton-nav.next {
                position: static;
                margin: 0 0.5rem;
            }

            .carrousel-container {
                margin: 0;
            }
        }

        /* Mode landscape vs portrait */
        @media (orientation: landscape) {
            .titre-accueil {
                margin-bottom: 1rem;
            }

            .carte-paysage {
                min-height: 250px;
            }

            .carte-thumbnail {
                height: 150px;
            }
        }
    </style>
</head>

<body>

    <!-- PAGE D'ACCUEIL -->
    <div id="page-accueil">
        <h1 class="titre-accueil">🐾 Les Animaux</h1>
        
        <div class="carrousel-container">
            <button class="bouton-nav prev" aria-label="Paysage précédent">❮</button>
            
            <div class="carrousel" id="carrousel">
                <!-- Les cartes seront générées par JavaScript -->
            </div>
            
            <button class="bouton-nav next" aria-label="Paysage suivant">❯</button>
        </div>
    </div>

    <!-- PAGE PAYSAGE -->
    <div id="page-paysage" class="cachee">
        <header class="entete">
            <button class="bouton-retour" id="btn-retour">← Retour</button>
            <h2 class="entete-titre" id="titre-paysage">Paysage</h2>
            <div style="width: 80px;"></div> <!-- Espacement pour centrer le titre -->
        </header>

        <div class="zone-paysage">
            <div class="conteneur-paysage" id="conteneur-paysage">
                <!-- Paysage et animaux générés par JavaScript -->
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // ===== VARIABLES GLOBALES =====
        let paysages = [];
        let paysageActuel = null;
        let niveauZoom = 1;
        let decalageX = 0;
        let decalageY = 0;

        const pageAccueil = document.getElementById('page-accueil');
        const pagePaysage = document.getElementById('page-paysage');
        const carrousel = document.getElementById('carrousel');
        const btnRetour = document.getElementById('btn-retour');
        const conteneurPaysage = document.getElementById('conteneur-paysage');
        const titrePaysage = document.getElementById('titre-paysage');

        // ===== CHARGEMENT DU JSON =====
        async function chargerPaysages() {
            try {
                const reponse = await fetch('./assets/json/paysages.json');
                if (!reponse.ok) throw new Error('Erreur de chargement');
                const data = await reponse.json();
                paysages = data.paysages; // Accède à la clé "paysages" du JSON

                afficherAccueil();
            } catch (erreur) {
                console.error('Erreur lors du chargement :', erreur);
                carrousel.innerHTML = '<p style="text-align: center; color: red;">Erreur : impossible de charger les paysages</p>';
            }
        }

        // ===== PAGE D'ACCUEIL =====
        function afficherAccueil() {
            pageAccueil.classList.remove('cachee');
            pagePaysage.classList.add('cachee');
            carrousel.innerHTML = '';

            paysages.forEach((paysage, index) => {
                const carte = document.createElement('div');
                carte.className = 'carte-paysage';
                carte.innerHTML = `
                    <img src="${paysage.image}" alt="Aperçu ${paysage.nom}" class="carte-thumbnail">
                    <div class="carte-nom">${paysage.nom}</div>
                `;
                carte.addEventListener('click', () => afficherPaysage(index));
                carrousel.appendChild(carte);
            });

            // Gestion du carrousel
            gererCarrousel();
        }

        function gererCarrousel() {
            const btnPrev = document.querySelector('.bouton-nav.prev');
            const btnNext = document.querySelector('.bouton-nav.next');

            btnPrev.addEventListener('click', () => {
                carrousel.scrollBy({
                    left: -400,
                    behavior: 'smooth'
                });
            });

            btnNext.addEventListener('click', () => {
                carrousel.scrollBy({
                    left: 400,
                    behavior: 'smooth'
                });
            });
        }

        // ===== PAGE PAYSAGE =====
        function afficherPaysage(indexPaysage) {
            paysageActuel = paysages[indexPaysage];
            pageAccueil.classList.add('cachee');
            pagePaysage.classList.remove('cachee');

            titrePaysage.textContent = paysageActuel.nom;
            
            // Réinitialiser le zoom
            niveauZoom = 1;
            decalageX = 0;
            decalageY = 0;

            // Afficher le paysage
            conteneurPaysage.style.backgroundImage = `url('${paysageActuel.image}')`;
            conteneurPaysage.innerHTML = '';

            // Ajouter les animaux
            paysageActuel.animaux.forEach(animal => {
                ajouterAnimal(animal);
            });

            // Réinitialiser le zoom et le pan
            mettreAJourTransformation();

            // Gestion des événements
            gererInteractionsZoom();
        }

        function ajouterAnimal(animal) {
            const img = document.createElement('img');
            img.src = animal.image;
            img.alt = animal.nom;
            img.className = 'animal';
            
            // Positionnement en pourcentages
            img.style.left = animal.x + '%';
            img.style.top = animal.y + '%';
            img.style.width = animal.largeur + 'px';
            img.style.transform = 'translate(-50%, -50%)';

            // Clic pour jouer le son
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                jouerSon(animal, img);
            });

            conteneurPaysage.appendChild(img);
        }

        function jouerSon(animal, elementImg) {
            const audio = new Audio(animal.son);
            audio.play().catch(erreur => {
                console.error('Erreur lecture son :', erreur);
            });

            // Animation visuelle
            elementImg.classList.add('jouant');
            setTimeout(() => elementImg.classList.remove('jouant'), 500);
        }

        // ===== GESTION DU ZOOM =====
        function gererInteractionsZoom() {
            const zone = document.querySelector('.zone-paysage');

            // Molette (desktop)
            zone.addEventListener('wheel', (e) => {
                e.preventDefault();
                const facteur = e.deltaY > 0 ? 0.9 : 1.1;
                niveauZoom *= facteur;
                niveauZoom = Math.max(1, Math.min(niveauZoom, 5)); // Entre 1 et 5
                mettreAJourTransformation();
            }, { passive: false });

            // Touch (tactile)
            let touchPrecedent = null;

            zone.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    touchPrecedent = calculerDistanceTouch(e.touches[0], e.touches[1]);
                }
            }, { passive: false });

            zone.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && touchPrecedent !== null) {
                    e.preventDefault();
                    const distanceActuelle = calculerDistanceTouch(e.touches[0], e.touches[1]);
                    const facteur = distanceActuelle / touchPrecedent;
                    niveauZoom *= facteur;
                    niveauZoom = Math.max(1, Math.min(niveauZoom, 5));
                    mettreAJourTransformation();
                    touchPrecedent = distanceActuelle;
                }
            }, { passive: false });

            zone.addEventListener('touchend', () => {
                touchPrecedent = null;
            });
        }

        function calculerDistanceTouch(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function mettreAJourTransformation() {
            conteneurPaysage.style.transform = `scale(${niveauZoom}) translate(${decalageX}px, ${decalageY}px)`;
        }

        // ===== BOUTON RETOUR =====
        btnRetour.addEventListener('click', afficherAccueil);

        // ===== INITIALISATION =====
        chargerPaysages();
    </script>

</body>
</html>
