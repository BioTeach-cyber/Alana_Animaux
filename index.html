<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaux Interactifs 🐾</title>
    <style>
        :root {
            --bleu: #53a4db;
            --vert: #7fbc48;
            --violet: #a6539b;
            --orange: #f3912b;
            --gris: #b7b7b7;
            --rouge: #e62d32;
            --rose: #ee7bab;
            --rose-genially: #161213;
            --jaune: #f4d32e;
            --marron: #a5706c;
            --noir: #494949;
            --fond: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--fond);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--noir);
        }

        /* ========== ÉCRAN D'ACCUEIL ========== */
        #accueil {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            background: linear-gradient(135deg, var(--vert) 0%, var(--bleu) 100%);
        }

        #accueil.cache {
            display: none;
        }

        #accueil h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: white;
            margin-bottom: 3rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Carrousel */
        .carrousel-conteneur {
            position: relative;
            width: 100%;
            max-width: 900px;
            background-color: var(--fond);
            border-radius: 1.5rem;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .carrousel {
            display: flex;
            transition: transform 0.4s ease;
        }

        .diapo {
            flex: 0 0 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(1rem, 5vw, 2rem);
            text-decoration: none;
            color: var(--noir);
            cursor: pointer;
        }

        .diapo-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            margin-bottom: 1rem;
            border-radius: 0.75rem;
        }

        .diapo-titre {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: bold;
            color: var(--bleu);
            text-align: center;
        }

        .diapo-bouton {
            margin-top: 1.5rem;
            padding: 0.75rem 2rem;
            background-color: var(--vert);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: clamp(1rem, 3vw, 1.2rem);
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: bold;
        }

        .diapo-bouton:hover {
            background-color: #6ab041;
        }

        /* Navigation carrousel */
        .carrousel-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .carrousel-btn {
            background-color: var(--bleu);
            color: white;
            border: none;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carrousel-btn:hover {
            background-color: #3a8bc9;
        }

        .carrousel-indicateurs {
            display: flex;
            gap: 0.5rem;
        }

        .indicateur {
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            background-color: var(--gris);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .indicateur.actif {
            background-color: var(--bleu);
        }

        /* ========== ÉCRAN JEU ========== */
        #jeu {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: var(--fond);
        }

        #jeu.cache {
            display: none;
        }

        /* Header du jeu */
        #headerJeu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.5rem;
            background-color: var(--vert);
            box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        }

        #nomPaysage {
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: bold;
            color: white;
            margin: 0;
        }

        .boutons-header {
            display: flex;
            gap: 0.75rem;
        }

        .btn-header {
            padding: 0.5rem 1rem;
            background-color: white;
            color: var(--vert);
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            font-size: clamp(0.8rem, 2vw, 1rem);
            transition: all 0.3s ease;
        }

        .btn-header:hover {
            background-color: #f0f0f0;
            transform: scale(1.05);
        }

        /* Conteneur du paysage */
        #conteneurPaysage {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fondPaysage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #f9f9f9;
        }

        /* Animaux */
        .animal {
            position: absolute;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .animal:hover {
            filter: brightness(1.1);
        }

        .animal img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .label-animal {
            position: absolute;
            bottom: -2rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--orange);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .animal:hover .label-animal {
            opacity: 1;
        }

        /* ========== ZOOM ========== */
        #conteneurPaysage.zoome {
            cursor: zoom-out;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            #accueil {
                padding: 1rem;
            }

            .carrousel-conteneur {
                max-width: 100%;
            }

            #headerJeu {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .boutons-header {
                gap: 0.5rem;
            }

            .btn-header {
                padding: 0.4rem 0.8rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- ÉCRAN D'ACCUEIL -->
    <section id="accueil">
        <h1>🐾 Animaux Interactifs</h1>
        
        <div class="carrousel-conteneur">
            <div class="carrousel" id="carrouselEl"></div>
        </div>

        <div class="carrousel-nav">
            <button class="carrousel-btn" id="btnPrecedent">‹</button>
            <div class="carrousel-indicateurs" id="indicateurs"></div>
            <button class="carrousel-btn" id="btnSuivant">›</button>
        </div>
    </section>

    <!-- ÉCRAN JEU -->
    <section id="jeu" class="cache">
        <header id="headerJeu">
            <h2 id="nomPaysage"></h2>
            <div class="boutons-header">
                <button class="btn-header" id="btnZoom">🔍 Zoom</button>
                <button class="btn-header" id="btnFullscreen">⛶ Plein écran</button>
                <button class="btn-header" id="btnRetour">← Retour</button>
            </div>
        </header>

        <div id="conteneurPaysage">
            <img id="fondPaysage" alt="Paysage">
            <div id="zoneAnimaux"></div>
        </div>
    </section>

    <script>
        "use strict";

        // ========== DONNÉES GLOBALES ==========
        let paysagesData = [];
        let indexCarrousel = 0;
        let paysageActuel = null;
        let echelle = 1;
        let zoomActif = false;

        // ========== CHARGEMENT DU JSON ==========
        async function chargerJSON() {
            try {
                const reponse = await fetch('./assets/json/paysages.json');
                if (!reponse.ok) throw new Error('Erreur HTTP: ' + reponse.status);
                
                const data = await reponse.json();
                paysagesData = Array.isArray(data.paysages) ? data.paysages : [];
                
                if (paysagesData.length === 0) {
                    console.error('Aucun paysage trouvé dans le JSON');
                    return;
                }

                initialiserAccueil();
            } catch (erreur) {
                console.error('Erreur chargement JSON:', erreur);
            }
        }

        // ========== ACCUEIL : CARROUSEL ==========
        function initialiserAccueil() {
            afficherCarrousel();
            ajouterEvenementsCarrousel();
        }

        function afficherCarrousel() {
            const carrouselEl = document.getElementById('carrouselEl');
            const indicateurs = document.getElementById('indicateurs');
            
            carrouselEl.innerHTML = '';
            indicateurs.innerHTML = '';

            paysagesData.forEach((paysage, index) => {
                // Diapo
                const diapo = document.createElement('div');
                diapo.className = 'diapo';
                diapo.innerHTML = `
                    <img class="diapo-image" src="${paysage.image}" alt="${paysage.nom}">
                    <h3 class="diapo-titre">${paysage.nom}</h3>
                    <button class="diapo-bouton">Découvrir →</button>
                `;
                diapo.addEventListener('click', () => lancerJeu(index));
                carrouselEl.appendChild(diapo);

                // Indicateur
                const indicateur = document.createElement('div');
                indicateur.className = 'indicateur' + (index === 0 ? ' actif' : '');
                indicateur.addEventListener('click', () => allerADiapo(index));
                indicateurs.appendChild(indicateur);
            });

            mettreAJourCarrousel();
        }

        function ajouterEvenementsCarrousel() {
            document.getElementById('btnPrecedent').addEventListener('click', () => {
                indexCarrousel = (indexCarrousel - 1 + paysagesData.length) % paysagesData.length;
                mettreAJourCarrousel();
            });

            document.getElementById('btnSuivant').addEventListener('click', () => {
                indexCarrousel = (indexCarrousel + 1) % paysagesData.length;
                mettreAJourCarrousel();
            });
        }

        function allerADiapo(index) {
            indexCarrousel = index;
            mettreAJourCarrousel();
        }

        function mettreAJourCarrousel() {
            const carrouselEl = document.getElementById('carrouselEl');
            carrouselEl.style.transform = `translateX(-${indexCarrousel * 100}%)`;

            document.querySelectorAll('.indicateur').forEach((ind, i) => {
                ind.classList.toggle('actif', i === indexCarrousel);
            });
        }

        // ========== JEU ==========
        function lancerJeu(indexPaysage) {
            paysageActuel = paysagesData[indexPaysage];
            echelle = 1;
            zoomActif = false;

            // Afficher l'écran jeu
            document.getElementById('accueil').classList.add('cache');
            document.getElementById('jeu').classList.remove('cache');

            // Remplir le header
            document.getElementById('nomPaysage').textContent = paysageActuel.nom;

            // Afficher le fond et les animaux
            const fondImg = document.getElementById('fondPaysage');
            fondImg.src = paysageActuel.image;
            fondImg.onload = () => {
                afficherAnimaux();
            };

            // Événements des boutons
            document.getElementById('btnZoom').addEventListener('click', basculerZoom, { once: true });
            document.getElementById('btnFullscreen').addEventListener('click', activerPleinEcran);
            document.getElementById('btnRetour').addEventListener('click', retournerAccueil);
        }

        function afficherAnimaux() {
            const zoneAnimaux = document.getElementById('zoneAnimaux');
            zoneAnimaux.innerHTML = '';

            const conteneur = document.getElementById('conteneurPaysage');
            const largeurConteneur = conteneur.offsetWidth;
            const hauteurConteneur = conteneur.offsetHeight;

            // Dimensions originales du paysage
            const largeurOrigine = paysageActuel.largeur;
            const hauteurOrigine = paysageActuel.hauteur;

            // Calcul du ratio d'adaptation
            const ratioX = largeurConteneur / largeurOrigine;
            const ratioY = hauteurConteneur / hauteurOrigine;
            const ratio = Math.min(ratioX, ratioY) * echelle;

            paysageActuel.animaux.forEach((animal) => {
                const conteneurAnimal = document.createElement('div');
                conteneurAnimal.className = 'animal';

                // Position et taille en pixels écran
                const x = animal.x * ratio;
                const y = animal.y * ratio;
                const largeur = animal.largeur * ratio;

                conteneurAnimal.style.left = x + 'px';
                conteneurAnimal.style.top = y + 'px';
                conteneurAnimal.style.width = largeur + 'px';
                conteneurAnimal.style.height = 'auto';

                const img = document.createElement('img');
                img.src = animal.image;
                img.alt = animal.nom;

                const label = document.createElement('div');
                label.className = 'label-animal';
                label.textContent = animal.nom;

                conteneurAnimal.appendChild(img);
                conteneurAnimal.appendChild(label);

                // Clic sur l'animal : jouer le son
                conteneurAnimal.addEventListener('click', (e) => {
                    e.stopPropagation();
                    jouerSon(animal.son);
                });

                zoneAnimaux.appendChild(conteneurAnimal);
            });
        }

        function basculerZoom() {
            const conteneur = document.getElementById('conteneurPaysage');

            if (!zoomActif) {
                echelle = 2;
                zoomActif = true;
                conteneur.classList.add('zoome');
                document.getElementById('btnZoom').textContent = '🔍 Dézoom';
            } else {
                echelle = 1;
                zoomActif = false;
                conteneur.classList.remove('zoome');
                document.getElementById('btnZoom').textContent = '🔍 Zoom';
            }

            afficherAnimaux();
        }

        function activerPleinEcran() {
            const elem = document.getElementById('jeu');
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch((err) => {
                    console.error('Erreur plein écran:', err);
                });
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            }
        }

        function jouerSon(cheminSon) {
            const audio = new Audio(cheminSon);
            audio.play().catch((err) => {
                console.error('Erreur lecture son:', err);
            });
        }

        function retournerAccueil() {
            // Quitter le plein écran si activé
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }

            // Réinitialiser les boutons
            document.getElementById('btnZoom').textContent = '🔍 Zoom';
            document.getElementById('btnZoom').removeEventListener('click', basculerZoom);
            document.getElementById('btnFullscreen').removeEventListener('click', activerPleinEcran);
            document.getElementById('btnRetour').removeEventListener('click', retournerAccueil);

            // Afficher accueil
            document.getElementById('jeu').classList.add('cache');
            document.getElementById('accueil').classList.remove('cache');

            paysageActuel = null;
            echelle = 1;
            zoomActif = false;
        }

        // ========== REDIMENSIONNEMENT ==========
        window.addEventListener('resize', () => {
            if (paysageActuel) {
                afficherAnimaux();
            }
        });

        // ========== LANCEMENT ==========
        document.addEventListener('DOMContentLoaded', chargerJSON);
    </script>
</body>
</html>
