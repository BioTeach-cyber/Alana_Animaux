<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Animaux de la Ferme</title>
    
    <style>
        :root {
            --vert: #7fbc48;
            --bleu: #53a4db;
            --noir: #494949;
            --gris: #b7b7b7;
            --fond: #ffffff;
            --rouge: #e62d32;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--fond);
            color: var(--noir);
            overflow: hidden;
        }

        /* ===== PAGE D'ACCUEIL ===== */
        #page-accueil {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
            background: linear-gradient(135deg, var(--vert) 0%, var(--bleu) 100%);
        }

        #page-accueil.cachee {
            display: none;
        }

        .titre-accueil {
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: var(--fond);
            margin-bottom: 2rem;
            text-align: center;
            font-weight: bold;
        }

        /* ===== CARROUSEL ===== */
        .conteneur-carrousel {
            width: 90%;
            max-width: 600px;
            background: var(--fond);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .affichage-principal {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: var(--gris);
            border-radius: 0.8rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .affichage-principal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.8rem;
        }

        .info-paysage {
            text-align: center;
        }

        .info-paysage h2 {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            color: var(--noir);
            margin-bottom: 0.5rem;
        }

        .info-paysage p {
            font-size: clamp(0.9rem, 2vw, 1rem);
            color: var(--gris);
        }

        /* Contrôles du carrousel */
        .controles-carrousel {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .btn-fleche {
            background-color: var(--bleu);
            color: var(--fond);
            border: none;
            border-radius: 0.5rem;
            padding: 0.8rem 1.2rem;
            font-size: clamp(1rem, 2vw, 1.5rem);
            cursor: pointer;
            transition: all 0.3s;
            flex: 0 0 auto;
        }

        .btn-fleche:hover {
            background-color: var(--vert);
            transform: scale(1.1);
        }

        .btn-fleche:active {
            transform: scale(0.95);
        }

        /* Indicateur de position */
        .indicateur-carrousel {
            font-size: clamp(0.9rem, 2vw, 1rem);
            color: var(--noir);
            min-width: 60px;
            text-align: center;
        }

        /* Bouton "Découvrir" */
        .btn-decouvrir {
            background-color: var(--vert);
            color: var(--fond);
            border: none;
            border-radius: 0.8rem;
            padding: 1rem;
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }

        .btn-decouvrir:hover {
            background-color: var(--bleu);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(83, 164, 219, 0.3);
        }

        .btn-decouvrir:active {
            transform: translateY(-1px);
        }

        /* ===== PAGE PAYSAGE ===== */
        #page-paysage {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        #page-paysage.cachee {
            display: none;
        }

        .en-tete {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            background-color: var(--fond);
            border-bottom: 2px solid var(--vert);
            gap: 1rem;
            flex-shrink: 0;
        }

        .btn-en-tete {
            background-color: var(--bleu);
            color: var(--fond);
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            font-size: clamp(0.9rem, 2vw, 1rem);
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .btn-en-tete:hover {
            background-color: var(--vert);
            transform: scale(1.05);
        }

        .btn-en-tete:active {
            transform: scale(0.95);
        }

        .titre-paysage {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--noir);
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
        }

        /* ===== ZONE PAYSAGE ===== */
        #zone-paysage {
            position: relative;
            width: 100%;
            flex-grow: 1;
            overflow: hidden;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .conteneur-paysage {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }

        .fond-paysage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .animal {
            position: absolute;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .animal:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .animal img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* ===== PLEIN ÉCRAN ===== */
        #btn-plein-ecran {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
        }

        #page-paysage:fullscreen {
            width: 100vw;
            height: 100vh;
        }

        #page-paysage:fullscreen .en-tete {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        #page-paysage:fullscreen #zone-paysage {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- PAGE D'ACCUEIL AVEC CARROUSEL -->
    <div id="page-accueil">
        <h1 class="titre-accueil">🐄 Les Animaux de la Ferme 🐷</h1>
        
        <div class="conteneur-carrousel">
            <!-- Image principale -->
            <div class="affichage-principal">
                <img id="image-carrousel" src="" alt="Paysage">
            </div>

            <!-- Infos du paysage -->
            <div class="info-paysage">
                <h2 id="nom-carrousel"></h2>
                <p id="desc-carrousel">Clique sur les animaux pour entendre leur son !</p>
            </div>

            <!-- Contrôles -->
            <div class="controles-carrousel">
                <button class="btn-fleche" id="btn-precedent">◀</button>
                <span class="indicateur-carrousel"><span id="index-actuel">1</span> / <span id="total-paysages">0</span></span>
                <button class="btn-fleche" id="btn-suivant">▶</button>
            </div>

            <!-- Bouton Découvrir -->
            <button class="btn-decouvrir" id="btn-decouvrir">🔍 Découvrir ce paysage</button>
        </div>
    </div>

    <!-- PAGE PAYSAGE -->
    <div id="page-paysage" class="cachee">
        <header class="en-tete">
            <button id="btn-retour" class="btn-en-tete" aria-label="Retour à l'accueil" title="Retour">
                ← Retour
            </button>
            <h1 id="titre-paysage" class="titre-paysage"></h1>
            <button id="btn-plein-ecran" class="btn-en-tete" aria-label="Plein écran" title="Plein écran">
                ⛶
            </button>
        </header>

        <div id="zone-paysage">
            <div id="conteneur-paysage" class="conteneur-paysage"></div>
        </div>
    </div>

    <script>
        "use strict";

        // ===== VARIABLES GLOBALES =====
        let paysages = [];
        let indexActuel = 0;
        let niveauZoom = 1;
        let decalageX = 0;
        let decalageY = 0;
        let touchPrecedent = null;
        let derniereTouchX = 0;
        let derniereTouchY = 0;

        // ===== ÉLÉMENTS DOM =====
        const pageAccueil = document.getElementById('page-accueil');
        const pagePaysage = document.getElementById('page-paysage');
        const imageCarrousel = document.getElementById('image-carrousel');
        const nomCarrousel = document.getElementById('nom-carrousel');
        const indexActuelSpan = document.getElementById('index-actuel');
        const totalPaysagesSpan = document.getElementById('total-paysages');
        const btnPrecedent = document.getElementById('btn-precedent');
        const btnSuivant = document.getElementById('btn-suivant');
        const btnDecouvrir = document.getElementById('btn-decouvrir');
        const btnRetour = document.getElementById('btn-retour');
        const titrePagePaysage = document.getElementById('titre-paysage');
        const conteneurPaysage = document.getElementById('conteneur-paysage');
        const zonePaysage = document.getElementById('zone-paysage');
        const btnPleinEcran = document.getElementById('btn-plein-ecran');

        // ===== CHARGER LES PAYSAGES =====
        async function chargerPaysages() {
            try {
                const reponse = await fetch('./assets/json/paysages.json');
                if (!reponse.ok) throw new Error(`HTTP ${reponse.status}`);
                
                const data = await reponse.json();
                paysages = data.paysages; // Accède à la clé "paysages" du JSON
                
                totalPaysagesSpan.textContent = paysages.length;
                afficherAccueil();
            } catch (erreur) {
                console.error('Erreur lors du chargement :', erreur);
                imageCarrousel.src = '';
                nomCarrousel.textContent = 'Erreur de chargement';
            }
        }

        // ===== AFFICHER L'ACCUEIL =====
        function afficherAccueil() {
            niveauZoom = 1;
            decalageX = 0;
            decalageY = 0;
            pageAccueil.classList.remove('cachee');
            pagePaysage.classList.add('cachee');
            mettreAJourCarrousel();
        }

        // ===== METTRE À JOUR LE CARROUSEL =====
        function mettreAJourCarrousel() {
            const paysageActuel = paysages[indexActuel];
            imageCarrousel.src = paysageActuel.image;
            nomCarrousel.textContent = paysageActuel.nom;
            indexActuelSpan.textContent = indexActuel + 1;
        }

        // ===== NAVIGATION CARROUSEL =====
        btnPrecedent.addEventListener('click', () => {
            indexActuel = (indexActuel - 1 + paysages.length) % paysages.length;
            mettreAJourCarrousel();
        });

        btnSuivant.addEventListener('click', () => {
            indexActuel = (indexActuel + 1) % paysages.length;
            mettreAJourCarrousel();
        });

        // ===== BOUTON DÉCOUVRIR =====
        btnDecouvrir.addEventListener('click', afficherPaysage);

        function afficherPaysage() {
            const paysageActuel = paysages[indexActuel];
            pageAccueil.classList.add('cachee');
            pagePaysage.classList.remove('cachee');

            titrePagePaysage.textContent = paysageActuel.nom;
            conteneurPaysage.innerHTML = '';

            // Ajouter le fond
            const imgFond = document.createElement('img');
            imgFond.src = paysageActuel.image;
            imgFond.classList.add('fond-paysage');
            conteneurPaysage.appendChild(imgFond);

            // Ajouter les animaux
            paysageActuel.animaux.forEach(animal => {
                const divAnimal = document.createElement('div');
                divAnimal.classList.add('animal');
                divAnimal.style.left = animal.x + '%';
                divAnimal.style.top = animal.y + '%';
                divAnimal.style.width = animal.largeur + 'px';
                divAnimal.style.height = animal.largeur + 'px';

                const imgAnimal = document.createElement('img');
                imgAnimal.src = animal.image;
                imgAnimal.alt = animal.nom;
                divAnimal.appendChild(imgAnimal);

                // Clic pour jouer le son
                divAnimal.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (animal.son) {
                        const audio = new Audio(animal.son);
                        audio.play().catch(err => console.warn('Son non disponible :', err));
                    }
                });

                conteneurPaysage.appendChild(divAnimal);
            });
        }

        // ===== ZOOM À LA MOLETTE =====
        zonePaysage.addEventListener('wheel', (e) => {
            e.preventDefault();
            const facteur = e.deltaY > 0 ? 0.9 : 1.1;
            niveauZoom *= facteur;
            niveauZoom = Math.max(1, Math.min(niveauZoom, 5));
            mettreAJourTransformation();
        }, { passive: false });

        // ===== DÉPLACEMENT À LA SOURIS =====
        let sourisPrecedente = null;

        zonePaysage.addEventListener('mousedown', (e) => {
            sourisPrecedente = { x: e.clientX, y: e.clientY };
            zonePaysage.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (sourisPrecedente && niveauZoom > 1) {
                const deltaX = e.clientX - sourisPrecedente.x;
                const deltaY = e.clientY - sourisPrecedente.y;

                decalageX += deltaX;
                decalageY += deltaY;

                mettreAJourTransformation();
                sourisPrecedente = { x: e.clientX, y: e.clientY };
            }
        });

        document.addEventListener('mouseup', () => {
            sourisPrecedente = null;
            zonePaysage.style.cursor = 'grab';
        });

        // ===== TACTILE : PINCH-TO-ZOOM =====
        zonePaysage.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                touchPrecedent = calculerDistanceTouch(e.touches[0], e.touches[1]);
                derniereTouchX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                derniereTouchY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            }
        });

        zonePaysage.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && touchPrecedent !== null) {
                const distanceActuelle = calculerDistanceTouch(e.touches[0], e.touches[1]);
                const ratio = distanceActuelle / touchPrecedent;

                niveauZoom *= ratio;
                niveauZoom = Math.max(1, Math.min(niveauZoom, 5));

                mettreAJourTransformation();
                touchPrecedent = distanceActuelle;
            }
        }, { passive: false });

        zonePaysage.addEventListener('touchend', () => {
            touchPrecedent = null;
        });

        // ===== UTILITAIRES =====
        function calculerDistanceTouch(touch1, touch2) {
            const dx = touch1.clientX - touch2.clientX;
            const dy = touch1.clientY - touch2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function mettreAJourTransformation() {
            conteneurPaysage.style.transform = `scale(${niveauZoom}) translate(${decalageX}px, ${decalageY}px)`;
        }

        // ===== BOUTON RETOUR =====
        btnRetour.addEventListener('click', afficherAccueil);

        // ===== BOUTON PLEIN ÉCRAN =====
        btnPleinEcran.addEventListener('click', async () => {
            try {
                if (!document.fullscreenElement) {
                    await pagePaysage.requestFullscreen().catch(err => {
                        console.warn('Plein écran non disponible :', err);
                    });
                } else {
                    await document.exitFullscreen();
                }
            } catch (err) {
                console.error('Erreur plein écran :', err);
            }
        });

        // Écouter quand on quitte le plein écran
        document.addEventListener('fullscreenchange', () => {
            // Rien à faire, juste pour éviter les erreurs
        });

        // ===== INITIALISATION =====
        chargerPaysages();
    </script>

</body>
</html>
